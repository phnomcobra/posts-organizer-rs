[package]
name = "posts-organizer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.13.0", default-features = false, features = ["macros"] }
bytes = "1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help"] }
clokwerk = "0.4.0"
env_logger = "0.11.10"
log = "0.4.29"
reqwest = { version = "0.13.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tracing-actix-web = "0.7.21"
serde_json = "1.0.149"
anyhow = "1.0.102"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.23.1", default-features = false, features = ["v4", "fast-rng", "std"] }
base64 = "0.23.1"
sha256 = "1.6.0"
regex = "1.13.1"
rand = "0.10.3"


[[bin]]
name = "posts-server"
path = "src/bin/server.rs"

[[bin]]
name = "posts-configure"
path = "src/bin/configure.rs"

[[bin]]
name = "posts-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "posts-stat"
path = "src/bin/stat.rs"

[features]
debian = []
